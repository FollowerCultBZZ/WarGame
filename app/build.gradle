
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.w8.game'
    compileSdk 34

    defaultConfig {
        applicationId 'io.w8.game'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations {
    natives
    atlasTools
}

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'

    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'

    atlasTools 'com.badlogicgames.gdx:gdx-tools:1.13.1'
}

// ========================================
// ANDROID NATIVES
// ========================================

tasks.register('copyAndroidNatives') {
    doLast {
        configurations.natives.files.each { jar ->
            def outputDir = null

            if (jar.name.contains('natives-armeabi-v7a')) {
                outputDir = file('src/main/jniLibs/armeabi-v7a')
            } else if (jar.name.contains('natives-arm64-v8a')) {
                outputDir = file('src/main/jniLibs/arm64-v8a')
            }

            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'copyAndroidNatives'
}

// ========================================
// TEXTURE PACKER
// ========================================

tasks.register('buildAtlases', JavaExec) {
    group = 'assets'
    description = 'Build LibGDX texture atlases'

    classpath = configurations.atlasTools

    mainClass.set(
        'com.badlogic.gdx.tools.texturepacker.TexturePacker'
    )

    doFirst {
        def inputDir = file('assets/atlases')
        def outputDir = file('assets/build')

        if (!inputDir.exists()) {
            throw new GradleException(
                "Atlas source directory not found: ${inputDir}"
            )
        }

        outputDir.mkdirs()

        args = [
            inputDir.absolutePath,
            outputDir.absolutePath,
            'game'
        ]
    }
}

// ========================================
// TILESET SPLITTER
// ========================================

tasks.register('splitTileset') {
    group = 'assets'
    description = 'Split PNG tileset into individual tiles'

    // INPUT
    def inputFile = file('assets/tileset.png')

    // OUTPUT
    def outputDir = file('assets/tiles')

    // GRID SETTINGS
    def columns = 16
    def rows = 16

    // SPACING SETTINGS
    def marginLeft = 0
    def marginTop = 0
    def spacingX = 0
    def spacingY = 0

    inputs.file(inputFile)
    outputs.dir(outputDir)

    doLast {

        if (!inputFile.exists()) {
            throw new GradleException(
                "Tileset not found: ${inputFile}"
            )
        }

        def image = javax.imageio.ImageIO.read(inputFile)

        if (image == null) {
            throw new GradleException(
                "Cannot read PNG image"
            )
        }

        if (columns <= 0 || rows <= 0) {
            throw new GradleException(
                "Invalid grid settings"
            )
        }

        int availableWidth =
            image.width - marginLeft * 2 -
            spacingX * (columns - 1)

        int availableHeight =
            image.height - marginTop * 2 -
            spacingY * (rows - 1)

        if (availableWidth <= 0 || availableHeight <= 0 ||
            availableWidth % columns != 0 ||
            availableHeight % rows != 0) {
            throw new GradleException(
                "Invalid tileset dimensions or spacing"
            )
        }

        int tileWidth = availableWidth / columns
        int tileHeight = availableHeight / rows

        outputDir.mkdirs()

        // REMOVE OLD TILES
        outputDir.listFiles()?.each { file ->
            if (file.isFile() && file.name.endsWith('.png')) {
                file.delete()
            }
        }

        // SPLIT
        for (int y = 0; y < rows; y++) {

            for (int x = 0; x < columns; x++) {

                int sourceX =
                    marginLeft + x * (tileWidth + spacingX)

                int sourceY =
                    marginTop + y * (tileHeight + spacingY)

                def tile = new java.awt.image.BufferedImage(
                    tileWidth,
                    tileHeight,
                    java.awt.image.BufferedImage.TYPE_INT_ARGB
                )

                def graphics = tile.createGraphics()

                graphics.drawImage(
                    image,
                    0, 0,
                    tileWidth, tileHeight,
                    sourceX, sourceY,
                    sourceX + tileWidth,
                    sourceY + tileHeight,
                    null
                )

                graphics.dispose()

                def outputFile = new File(
                    outputDir,
                    "tile_${y}_${x}.png"
                )

                javax.imageio.ImageIO.write(
                    tile,
                    'png',
                    outputFile
                )
            }
        }

        println ""
        println "========== TILESET =========="
        println "Input: ${inputFile.name}"
        println "Image: ${image.width}x${image.height}"
        println "Grid: ${columns}x${rows}"
        println "Tile: ${tileWidth}x${tileHeight}"
        println "Total: ${columns * rows}"
        println "Output: ${outputDir}"
        println "============================="
    }
}

// ========================================
// BUILD ALL ASSETS
// ========================================

tasks.register('buildAssets') {
    group = 'assets'
    description = 'Process all game assets'

    dependsOn 'splitTileset'
    dependsOn 'buildAtlases'
}
