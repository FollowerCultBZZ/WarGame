
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.w8.game'
    compileSdk 34

    defaultConfig {
        applicationId 'io.w8.game'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations {
    natives
    atlasTools
}

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'

    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'

    atlasTools 'com.badlogicgames.gdx:gdx-tools:1.13.1'
}

// ========================================
// ANDROID NATIVES
// ========================================

tasks.register('copyAndroidNatives') {
    doLast {
        configurations.natives.files.each { jar ->
            def outputDir = null

            if (jar.name.contains('natives-armeabi-v7a')) {
                outputDir = file('src/main/jniLibs/armeabi-v7a')
            } else if (jar.name.contains('natives-arm64-v8a')) {
                outputDir = file('src/main/jniLibs/arm64-v8a')
            }

            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'copyAndroidNatives'
}


// ========================================
// TEXTURE ATLAS
// ========================================

tasks.register('buildAtlases', JavaExec) {
    group = 'assets'
    description = 'Build LibGDX texture atlases'

    classpath = configurations.atlasTools
    mainClass.set('com.badlogic.gdx.tools.texturepacker.TexturePacker')

    def inputDir = file('assets/sprites')
    def outputDir = file("src/main/assets/atlases")

    inputs.dir(inputDir)
    outputs.dir(outputDir)

    doFirst {
        if (!inputDir.exists()) {
            throw new GradleException("Atlas source directory not found: ${inputDir}")
        }

        outputDir.mkdirs()

        project.delete(project.fileTree(outputDir) {
            include 'game.atlas', 'game*.png'
        })

        args = [
            inputDir.absolutePath,
            outputDir.absolutePath,
            'game'
        ]
    }

    doLast {
        def atlasFile = new File(outputDir, 'game.atlas')
        def pageFile = new File(outputDir, 'game.png')

        if (!atlasFile.isFile() || !pageFile.isFile()) {
            throw new GradleException(
                "TexturePacker did not generate game.atlas and game.png in ${outputDir}. Check app/assets/sprites and pack.json."
            )
        }

        logger.lifecycle("Texture atlas generated: ${atlasFile}")
    }
}

tasks.named('preBuild').configure {
    dependsOn 'buildAtlases'
}
